# JELLY LAND 실시간 위치 서버 (Cloudflare Workers + Durable Objects)
# 광장/라운지마다 방(Durable Object) 하나 → 같은 방 사람들끼리 위치를 바로바로 주고받음
name = "jellyland"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# 로그인 확인을 맡기는 젤리랜드 주소
API_ORIGIN = "https://jellyland.netlify.app"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
